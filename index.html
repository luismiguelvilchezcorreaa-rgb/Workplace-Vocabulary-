<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workplace Vocabulary Lab | Unit 12</title><style>
:root{--navy:#102b49;--teal:#0d9488;--amber:#f59e0b;--bg:#f2f6fb;--ink:#17283e;--muted:#65758b;--border:#dce6f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,#102b49,#174e70);color:white;padding:30px max(20px,calc((100vw - 1100px)/2))}header h1{font-size:clamp(27px,4vw,43px);margin:4px 0}header p{opacity:.87;margin:0}.eyebrow{letter-spacing:2px;font-size:12px;font-weight:800;color:#6ee7d6}main{max-width:1100px;margin:auto;padding:22px 16px 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.tabs button{background:white;color:var(--navy);border:1px solid var(--border)}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;transition:.15s}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5eead4;outline-offset:2px}.tabs button.active,.primary{background:var(--teal)!important;color:white!important}.secondary{background:#e7eff8;color:var(--navy)}.danger{background:#fff0e9;color:#9a3412}.panel{background:white;border:1px solid var(--border);border-radius:20px;padding:clamp(18px,3vw,30px);box-shadow:0 8px 30px #1d45630c}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{display:inline-block;background:#e4f8f3;color:#08786f;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile{background:#f8fbff;border:1px solid var(--border);border-radius:15px;padding:18px}.tile h3{margin:5px 0;font-size:19px}.big{font-size:clamp(26px,4vw,38px);font-weight:850;line-height:1.2;margin:14px 0}.translation{color:#0b766d;font-weight:750}.example{background:#f0f7ff;border-left:4px solid #3b82f6;padding:12px;border-radius:8px;margin:12px 0}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.progress{height:10px;background:#e6edf5;border-radius:20px;overflow:hidden;margin:12px 0 22px}.progress>div{height:100%;background:var(--teal);transition:width .2s}.answer{display:block;width:100%;text-align:left;background:#f7fafd;border:1px solid var(--border);margin:9px 0}.answer.selected{border-color:#0d9488;background:#e9faf6}.answer.correct{background:#e4f9eb;border-color:#16a34a}.answer.wrong{background:#fff0ee;border-color:#ef4444}.feedback{margin:15px 0;padding:14px;border-radius:12px;background:#edf5ff}.feedback.good{background:#e6f8ed}.feedback.bad{background:#fff3e9}.wordbank{display:flex;gap:8px;flex-wrap:wrap;min-height:56px;padding:10px;background:#f5f8fd;border:1px dashed #aac0d5;border-radius:12px}.wordbank button{background:white;border:1px solid #c8d8e6}.wordbank button:disabled{opacity:.35}.builder{background:#eaf8f5;border:1px dashed #0d9488;min-height:64px;padding:12px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap}.builder button{background:white;border:1px solid #0d9488}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;background:#f5f9fd;border-radius:14px;padding:15px}.stat strong{font-size:25px;display:block;color:var(--navy)}input,select{font:inherit;border:1px solid #b8c9da;border-radius:12px;padding:12px;width:100%;max-width:540px;background:white}.muted{font-size:13px;color:var(--muted)}.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin:9px 0}.matchrow select{max-width:none}.footer{text-align:center;color:var(--muted);margin-top:25px;font-size:13px}@media(max-width:560px){.matchrow{grid-template-columns:1fr}.tabs button{flex:1 1 42%}.panel{padding:16px}}

['fill in for','sustituir temporalmente a alguien','Can you fill in for me this afternoon?','¿Puedes sustituirme esta tarde?'],['be snowed under','estar hasta arriba de trabajo','I am snowed under with paperwork.','Estoy saturado de papeleo.'],['put off','posponer','We put off the meeting until Friday.','Pospusimos la reunión hasta el viernes.'],['pencil in','anotar provisionalmente en la agenda','Let’s pencil in a meeting for Friday.','Anotemos provisionalmente una reunión para el viernes.'],['draw up','redactar / preparar un documento','I have drawn up the contract.','He redactado el contrato.'],['fall through','fracasar / no concretarse','The deal has fallen through.','El acuerdo no se ha concretado.'],['take on','contratar / incorporar personal','The factory is taking on new workers.','La fábrica está contratando nuevos trabajadores.'],['close down','cerrar definitivamente','The business is closing down.','El negocio está cerrando definitivamente.'],['note down','anotar','Please note down these figures.','Por favor, anota estas cifras.'],['key in','introducir datos con el teclado','Key the numbers into the system.','Introduce los números en el sistema.'],['step down','renunciar a un cargo','The director is stepping down.','El director está dejando su cargo.'],['measure up to','estar a la altura de','The results did not measure up to expectations.','Los resultados no estuvieron a la altura de las expectativas.'],['pick up','mejorar / recuperarse','Business has picked up this quarter.','El negocio ha mejorado este trimestre.'],['drum up','generar / despertar interés','The campaign drummed up interest.','La campaña generó interés.'],['bring forward','adelantar una fecha','They brought forward the meeting.','Adelantaron la reunión.'],['copy someone in','poner a alguien en copia','I copied you in on the email.','Te puse en copia en el correo.'],

e.'],['fire','despedir','They fired the employee.','Despidieron al empleado.'],['dismiss','despedir / destituir','He was dismissed for misconduct.','Fue despedido por mala conducta.'],['discharge','desvincular / dar de baja','The company discharged the employee.','La empresa desvinculó al empleado.'],['recruit','reclutar / contratar','The firm recruits new graduates.','La empresa recluta a recién graduados.'],['learn the ropes','aprender cómo funciona el trabajo','You will soon learn the ropes.','Pronto aprenderás cómo funciona el trabajo.'],['on duty','de servicio / de turno','The security guard is on duty.','El guardia de seguridad está de servicio.'],['be burnt out','estar agotado por exceso de trabajo','They are burnt out after months of overtime.','Están agotados después de meses de horas extras.'],['have your work cut out','tener una tarea muy difícil por delante','You have your work cut out to finish today.','Tienes una tarea muy difícil por delante para terminar hoy.']];

['The new executive has ___ an active role in the sales team.',['assumed','excelled'],'assumed','Asumir un papel: assume a role.'],['Part of my job involves ___ duties to team members.',['initiating','delegating'],'delegating','Delegar tareas: delegate duties.'],['Your contract will ___ the employment terms.',['stipulate','operate'],'stipulate','Estipular condiciones: stipulate.'],['All staff will be ___ their weekly tasks.',['assigned','appointed'],'assigned','Asignar tareas: be assigned tasks.'],['Our new service ___ to young professionals.',['caters','supplies'],'caters','Atender las necesidades de: cater to.'],['British companies often ___ telephone support to other countries.',['outsource','commute'],'outsource','Subcontratar: outsource.'],['Your progress will be ___ by your supervisor.',['implemented','evaluated'],'evaluated','Evaluar el progreso: evaluate.'],['I will ___ to outline the schedule quickly.',['prioritise','endeavour'],'endeavour','Esforzarse: endeavour.']];

['Could you ___ for me this afternoon?','fill in','fill in for = sustituir'],['I am completely ___ under with work.','snowed','snowed under = saturado'],['We had to ___ off the meeting.','put','put off = posponer'],['Let’s ___ in Friday for our meeting.','pencil','pencil in = agendar provisionalmente'],['I have ___ up the contract.','drawn','draw up = redactar'],['The deal has ___ through.','fallen','fall through = fracasar'],['The factory is ___ on new workers.','taking','take on = contratar'],['The business is ___ down permanently.','closing','close down = cerrar'],['Please ___ down these figures.','note','note down = anotar'],['I will ___ the figures into the laptop.','key','key in = ingresar datos'],['Why is the director ___ down?','stepping','step down = dejar el cargo'],['He didn’t ___ up to expectations.','measure','measure up to = estar a la altura'],['Business has ___ up this quarter.','picked','pick up = mejorar'],['The campaign ___ up interest.','drummed','drum up = generar interés'],['They had ___ forward the meeting.','brought','bring forward = adelantar'],['I ___ you in on the email.','copied','copy in = poner en copia']];

let state={tab:'home',card:0,flip:false,idx:0,score:0,answered:false,selected:'',match:[],built:[],exam:[],examIndex:0,examAnswers:[],examDone:false};let saved={};try{saved=JSON.parse(localStorage.getItem('vocabLab12')||'{}')}catch(e){};const el=document.getElementById('view');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('vocabLab12',JSON.stringify(saved))}function speak(s){if(!('speechSynthesis'in window)){alert('Speech is not supported by this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function bar(i,total){return `<div class="progress"><div style="width:${Math.round(i/total*100)}%"></div></div>`}function tabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}function go(tab){state.tab=tab;state.idx=0;state.score=0;state.answered=false;state.selected='';state.match=[];state.built=[];state.examDone=false;state.examIndex=0;state.examAnswers=[];state.exam=[];tabs();render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));function home(){el.innerHTML=`<div class="topline"><span class="pill">B1–B2 • ENGLISH FOR WORK</span><span class="sub">${V.length} expressions • 6 activities</span></div><h2>Learn vocabulary you can actually use at work</h2><p class="sub">Estudia vocabulario profesional con traducciones, ejemplos, pronunciación y corrección inmediata. Ideal para practicar de manera autónoma.</p><div class="stats"><div class="stat"><strong>${V.length}</strong>Expressions</div><div class="stat"><strong>${Object.keys(saved.learned||{}).length}</strong>Cards learned</div><div class="stat"><strong>${saved.best??'—'}</strong>Best exam score / 20</div></div><h3>Choose your practice</h3><div class="grid">${[['cards','🃏','Flashcards','Vocabulary + Spanish meanings'],['choice','🎯','Multiple Choice','Select the correct word'],['blank','✍️','Fill the Gap','Complete workplace sentences'],['match','🔗','Match','English ↔ Español'],['build','🧩','Sentence Builder','Order words correctly'],['exam','🏆','Final Challenge','20 questions + review']].map(a=>`<div class="tile"><div style="font-size:28px">${a[1]}</div><h3>${a[2]}</h3><p class="sub">${a[3]}</p><button class="primary" onclick="go('${a[0]}')">Start →</button></div>`).join('')}</div>`}
function cards(){let v=V[state.card];el.innerHTML=`<div class="topline"><span class="pill">FLASHCARDS</span><span>${state.card+1} / ${V.length}</span></div>${bar(state.card+1,V.length)}<p class="sub">Tap Reveal to see the meaning, or use the speaker for pronunciation.</p><div class="tile" style="text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center"><div class="big">${esc(v[0])}</div><div class="controls" style="justify-content:center"><button class="secondary" onclick="speak(V[state.card][0])">🔊 Listen</button></div>${state.flip?`<h3 class="translation">${esc(v[1])}</h3><div class="example">${esc(v[2])}<br><span class="translation">${esc(v[3])}</span></div><button class="secondary" onclick="speak(V[state.card][2])">🔊 Listen to example</button>`:''}</div><div class="controls"><button class="secondary" onclick="state.card=Math.max(0,state.card-1);state.flip=false;render()">← Previous</button><button class="primary" onclick="state.flip=!state.flip;render()">${state.flip?'Hide meaning':'Reveal meaning / Ver significado'}</button><button class="secondary" onclick="state.card=(state.card+1)%V.length;state.flip=false;render()">Next →</button><button class="secondary" onclick="saved.learned=saved.learned||{};saved.learned[state.card]=true;save();state.card=(state.card+1)%V.length;state.flip=false;render()">✓ I know this</button></div>`}
function choice(){if(state.idx>=Q.length)return finish('Multiple Choice',Q.length);let q=Q[state.idx];el.innerHTML=`<div class="topline"><span class="pill">MULTIPLE CHOICE</span><span>Score ${state.score} • ${state.idx+1}/${Q.length}</span></div>${bar(state.idx,Q.length)}<h2>${esc(q[0])}</h2>${q[1].map(a=>`<button class="answer ${state.answered?(a===q[2]?'correct':a===state.selected?'wrong':''):''}" ${state.answered?'disabled':''} onclick="state.selected=${JSON.stringify(a).replace(/"/g,'&quot;')};state.answered=true;if(state.selected===Q[state.idx][2])state.score++;render()">${esc(a)}</button>`).join('')}${state.answered?`<div class="feedback ${state.selected===q[2]?'good':'bad'}"><strong>${state.selected===q[2]?'✓ Correct!':'✗ Try to remember:'}</strong> ${esc(q[2])}<br>${esc(q[3])}</div><button class="primary" onclick="next()">Next →</button>`:''}`}
function blank(){if(state.idx>=G.length)return finish('Fill the Gap',G.length);let q=G[state.idx],parts=q[0].split('___');el.innerHTML=`<div class="topline"><span class="pill">FILL THE GAP</span><span>Score ${state.score} • ${state.idx+1}/${G.length}</span></div>${bar(state.idx,G.length)}<h2>Complete the sentence</h2><p class="big" style="font-size:25px">${esc(parts[0])}<span style="color:#0d9488">________</span>${esc(parts[1])}</p><input id="gap" autocomplete="off" placeholder="Type the missing word..." ${state.answered?'disabled':''} value="${esc(state.selected)}"><div class="controls"><button class="secondary" onclick="speak(G[state.idx][0].replace('___',G[state.idx][1]))">🔊 Listen</button>${!state.answered?'<button class="primary" onclick="checkBlank()">Check answer</button>':'<button class="primary" onclick="next()">Next →</button>'}</div>${state.answered?`<div class="feedback ${state.selected.trim().toLowerCase()===q[1]?'good':'bad'}">Correct answer: <strong>${esc(q[1])}</strong><br>${esc(q[2])}</div>`:''}`;let inp=document.getElementById('gap');if(inp&&!state.answered)inp.onkeydown=e=>{if(e.key==='Enter')checkBlank()}}
function checkBlank(){state.selected=document.getElementById('gap').value.trim();if(!state.selected)return;state.answered=true;if(state.selected.toLowerCase()===G[state.idx][1])state.score++;render()}
function next(){state.idx++;state.answered=false;state.selected='';render()}function finish(name,total){el.innerHTML=`<span class="pill">ACTIVITY COMPLETE</span><h2>${name}</h2><div class="big">${state.score} / ${total}</div><p>${state.score/total>=.8?'Excellent work! ¡Excelente trabajo!':'Keep practising! ¡Sigue practicando!'}</p><div class="controls"><button class="primary" onclick="go(state.tab)">Try again</button><button class="secondary" onclick="go('home')">Back home</button></div>`}
let matchSet=[];function initMatch(){matchSet=[...V].sort(()=>Math.random()-.5).slice(0,8);state.match=Array(8).fill('')}function match(){if(!matchSet.length)initMatch();let options=[...matchSet.map(v=>v[1])].sort((a,b)=>a.localeCompare(b));let correct=state.match.filter((v,i)=>v===matchSet[i][1]).length;el.innerHTML=`<div class="topline"><span class="pill">MATCH THE MEANING</span><span>8 expressions</span></div><h2>Connect English to Spanish</h2><p class="sub">Selecciona la traducción correcta de cada expresión.</p>${matchSet.map((v,i)=>`<div class="matchrow"><strong>${i+1}. ${esc(v[0])} <button class="secondary" style="padding:4px 8px" onclick="speak(matchSet[${i}][0])">🔊</button></strong><select aria-label="Spanish meaning of ${esc(v[0])}" onchange="state.match[${i}]=this.value"><option value="">Choose the meaning...</option>${options.map(o=>`<option ${state.match[i]===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`).join('')}<div class="controls"><button class="primary" onclick="checkMatch()">Check matches</button><button class="secondary" onclick="matchSet=[];initMatch();render()">New set</button></div><div id="matchfeedback"></div>`}function checkMatch(){let correct=state.match.filter((v,i)=>v===matchSet[i][1]).length;document.getElementById('matchfeedback').innerHTML=`<div class="feedback ${correct===8?'good':'bad'}"><strong>${correct}/8 correct</strong><p>${matchSet.map((v,i)=>state.match[i]===v[1]?'':`<span style="display:block">${esc(v[0])} = ${esc(v[1])}</span>`).join('')}</p></div>`}
function build(){if(state.idx>=B.length)return finish('Sentence Builder',B.length);let q=B[state.idx];if(!state.words){state.words=q[0].split(' ').sort(()=>Math.random()-.5)}let used=state.built.map(x=>x.index);el.innerHTML=`<div class="topline"><span class="pill">SENTENCE BUILDER</span><span>Score ${state.score} • ${state.idx+1}/${B.length}</span></div>${bar(state.idx,B.length)}<h2>Build the English sentence</h2><p class="translation">${esc(q[1])}</p><p class="sub">Tap words in the correct order. Pulsa las palabras en orden.</p><div class="builder">${state.built.map((x,i)=>`<button onclick="state.built.splice(${i},1);render()">${esc(x.word)} ×</button>`).join('')}</div><h3>Word bank</h3><div class="wordbank">${state.words.map((w,i)=>`<button ${used.includes(i)?'disabled':''} onclick="state.built.push({word:state.words[${i}],index:${i}});render()">${esc(w)}</button>`).join('')}</div><div class="controls"><button class="secondary" onclick="state.built=[];render()">Clear</button>${!state.answered?'<button class="primary" onclick="checkBuild()">Check sentence</button>':'<button class="primary" onclick="state.idx++;state.built=[];state.words=null;state.answered=false;render()">Next →</button>'}</div>${state.answered?`<div class="feedback ${state.selected==='yes'?'good':'bad'}">${state.selected==='yes'?'✓ Correct!':'Correct sentence:'} <strong>${esc(q[0])}</strong><br><button class="secondary" onclick="speak(B[state.idx][0])">🔊 Listen</button></div>`:''}`}
function checkBuild(){let built=state.built.map(x=>x.word).join(' ');state.selected=built===B[state.idx][0]?'yes':'no';if(state.selected==='yes')state.score++;state.answered=true;render()}
function initExam(){let pool=[...Q.map(x=>({type:'choice',q:x[0],options:x[1],a:x[2],ex:x[3]})),...G.map(x=>({type:'blank',q:x[0],a:x[1],ex:x[2]}))];state.exam=pool.sort(()=>Math.random()-.5).slice(0,20);state.examIndex=0;state.examAnswers=[]}function exam(){if(!state.exam.length)initExam();if(state.examDone){let n=state.examAnswers.filter(x=>x.ok).length;saved.best=Math.max(saved.best||0,n);save();el.innerHTML=`<span class="pill">FINAL CHALLENGE COMPLETE</span><h2>Your result / Tu resultado</h2><div class="big">${n} / 20 • ${n*5}%</div><p>${n>=16?'Excellent! Strong workplace vocabulary.':'Review the corrections below and try again.'}</p><h3>Review your answers</h3>${state.exam.map((q,i)=>`<div class="tile" style="margin:9px 0"><strong>${i+1}. ${esc(q.q)}</strong><p>${state.examAnswers[i].ok?'✅':'❌'} Your answer: ${esc(state.examAnswers[i].value||'(blank)')}<br><span class="translation">Correct: ${esc(q.a)}</span><br><span class="muted">${esc(q.ex)}</span></p></div>`).join('')}<div class="controls"><button class="primary" onclick="go('exam')">New challenge</button><button class="secondary" onclick="go('home')">Home</button></div>`;return}let i=state.examIndex,q=state.exam[i];el.innerHTML=`<div class="topline"><span class="pill">FINAL CHALLENGE</span><span>${i+1} / 20</span></div>${bar(i,20)}<h2>${esc(q.q)}</h2>${q.type==='choice'?q.options.map(a=>`<button class="answer" onclick="submitExam(${JSON.stringify(a).replace(/"/g,'&quot;')})">${esc(a)}</button>`).join(''):`<input id="examinput" placeholder="Write the missing word" autocomplete="off"><div class="controls"><button class="primary" onclick="submitExam(document.getElementById('examinput').value)">Submit →</button></div>`}<p class="muted">You will see the corrections at the end. Verás las respuestas al terminar.</p>`;let inp=document.getElementById('examinput');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')submitExam(inp.value)}}function submitExam(v){v=String(v).trim();if(!v)return;let q=state.exam[state.examIndex];state.examAnswers.push({value:v,ok:v.toLowerCase()===q.a.toLowerCase()});state.examIndex++;if(state.examIndex>=20)state.examDone=true;render()}
function render(){if(state.tab==='home')home();else if(state.tab==='cards')cards();else if(state.tab==='choice')choice();else if(state.tab==='blank')blank();else if(state.tab==='match')match();else if(state.tab==='build')build();else if(state.tab==='exam')exam()}render();
</script></body></html>
